name: CPVisualizer
version: '${version}'
main: io.github.cpvisualizer.CoreProtectVisualizerPlugin
api-version: '26.3'
description: Private visualization of CoreProtect history
depend: [CoreProtect]
commands:
  cpv:
    description: CoreProtect Visualizer
    permission: cpvisualizer.use
    usage: /cpv
permissions:
  cpvisualizer.use:
    default: op
  cpvisualizer.search:
    default: op
  cpvisualizer.teleport:
    default: op
  cpvisualizer.admin:
    default: op
    children:
      cpvisualizer.use: true
      cpvisualizer.search: true
      cpvisualizer.teleport: true
